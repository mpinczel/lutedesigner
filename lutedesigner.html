	<button onclick="body_normal_map();" title="Where do the perpendiculars, or normals, of each ribs segment point to on the soundboard">Normal map</button>
	
	<button onclick="body_normal_map('straight');" title="Where do rays shot along the z-axis reflect back on the soundboard. Color shows how many reflections it took to get to the soundboard.">Reflections (Z-axis)</button>
	
	<button onclick="body_normal_map('bridge');" title="Where do rays shot from the bridge reflect back on the soundboard. Color shows how many reflections it took to get to the soundboard.">Reflections (bridge)</button>
	</label>
	
	<label>
	<button onclick="delel(getelid('analysis-normals'));" title="">Hide maps</button>
	</label>
	
	<label><input id="keep_drawing_reflection" type="checkbox">Redraw map after setting change</label>
	
	
</div>
<button class="collapsible" >Case</button>
<div id="case" class="options_area" > 
	
	
	<label><input id="drawcase" type="checkbox" onchange="calculatecase(this)">Draw case on top of instrument</label>
	
	<label>Case style - lid
	<select id="casestylelid" name="casestylelid" onchange="settingchange(this)">
		<option value="rectilinear" selected >Rectilinear</option>
		<option value="curvysharp">Curvy - sharp tube joint</option>
		<option value="curvy">Curvy - smooth tube joint</option>
	</select>
	</label>
	
	<label>Case style - side
	<select id="casestyleside" name="casestyleside" onchange="settingchange(this)">
		<option value="flat" selected >Flat</option>
		<!-- <option value="flatpegbox">Flat /w pegbox</option> -->
		<option value="curvy">Curvy /w pegbox</option>
		<option value="curvytube">Curvy /w tube</option>
		<option value="lute">Lute bowl /w pegbox</option>
		<option value="lutetube">Lute bowl /w tube</option>
	</select>
	</label>
	<label>Neck tube style
	<select id="tubestyle" name="tubestyle" onchange="settingchange(this)">
		<option value="bentbox" selected>Bent - box</option>
		<option value="bentcurvy" >Bent - curvy</option>
		<option value="straight">Straight</option>
		<option value="telescopic">Telescopic</option>
	</select>
	</label>
	
	<label>Plywood thickness
	<input id="casewoodthick" size="2" step="0.1" onchange="settingchange(this)" type="number" value="4">mm</label>
	
	<label>Foam thickness
	<input id="casefoamthick" size="2" step="1" onchange="settingchange(this)" type="number" value="20">mm</label>
	
	<label>	<button onclick="auto_case();" title="Attempt to automatically figure out case size">Automatic size</button></label>
	
	
	
	<label>Width
	<input id="casewidth" size="2" step="1" onchange="settingchange(this)" type="number" value="300">mm</label>
	
	<label>Length
	<input id="caselength" size="2" step="1" onchange="settingchange(this)" type="number" value="1000">mm</label>
	
	<label>Depth
	<input id="casedepth" size="2" step="1" onchange="settingchange(this)" type="number" value="200">mm</label>
	
	<label>Tube width
	<input id="tubewidth" size="2" step="1" onchange="settingchange(this)" type="number" value="200">mm</label>
	
	<label>Tube Depth
	<input id="tubedepth" size="2" step="1" onchange="settingchange(this)" type="number" value="150">mm</label>
	
	<label>Pegbox Depth
	<input id="pegboxdepth" size="2" step="1" onchange="settingchange(this)" type="number" value="250">mm</label>
	
	<label>Pegbox area Length
	<input id="pegboxlength" size="2" step="1" onchange="settingchange(this)" type="number" value="100">mm</label>
	
	
	<label>Lower radius
	<input id="lowerradius" size="2" step="1" onchange="settingchange(this)" type="number" value="100">mm</label>
	
	<label>Tube radius
	<input id="tuberadius" size="2" step="1" onchange="settingchange(this)" type="number" value="50">mm</label>
	
	<label>Bowl side radius
	<input id="bowlradius" size="2" step="1" onchange="settingchange(this)" type="number" value="1000">mm</label>
	
	
	<label>Bowl radius center
	<input id="bowlradiusc" size="2" step="1" onchange="settingchange(this)" type="number" value="200">mm</label>
	
	
	
	
</div>


<br>

</div>

	<svg id="designer-canvas" style="width:100%;height:100%;overflow: visible;touch-action:none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin meet">
	</svg>
	
<div id="bodyviewer" class="hidebodyviewer"></div>
<div id="tools">
	<button id="zoominbutton" class="toolbuttons" onclick="zoom_editor(event);" title="Zoom in. Also available on mousewheel."> </button>
	<button id="zoomoutbutton" class="toolbuttons" onclick="zoom_editor(event);" title="Zoom out. Also available on mousewheel."> </button>
	<button id="undobutton" class="toolbuttons" onclick="undo_changes();" title="Undo. Also ctrl+z"> </button>
	<button id="redobutton" class="toolbuttons" onclick="redo_changes();" title="Redo. Also ctrl+shift+z or ctrl+y"> </button>
	<button id="measurebutton" class="toolbuttons" onclick="if (measuremode) {measuremode=false;this.classList.remove('clicked')} else {measuremode=true;this.classList.add('clicked')}" title="Measure Tool. Normally middle mouse button or wheel, click here to temporarily use left click instead."> </button>
	<button id="bodyviewerbutton" class="toolbuttons" onclick="start_bodyviewer(this);" title="View instrument in glorious, futuristic 3D."> </button>
